<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef2f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c1513" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="LockIn: five-minute daily reps that turn you into a creator brands can hire.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LockIn">
  <title>LockIn</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400..700&family=JetBrains+Mono:wght@500..700&display=swap">

<body>
  <!-- app:markup -->
  <div id="app"></div>
  <noscript><p style="padding:16px">LockIn needs JavaScript to run.</p></noscript>
  <!-- /app:markup -->
  <script src="config.js"></script>
  <script src="src/content.js"></script>
  <script src="src/engine.js"></script>
  <script src="src/grader.js"></script>
  <script src="src/coach.js"></script>
  <script src="src/studio.js"></script>
  <script src="src/router.js"></script>
  <script src="src/voice.js"></script>
  <script src="src/instagram.js"></script>
  <script src="src/app.js"></script>
  <script>
    // Register the offline worker, and offer a reload when a newer build has taken over.
    (function () {
      try {
        if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
        var hadWorker = !!navigator.serviceWorker.controller;
        var offer = function () {
          if (document.getElementById('update-toast')) return;
          var t = document.createElement('div');
          t.id = 'update-toast'; t.className = 'update-toast'; t.setAttribute('role', 'status');
          t.innerHTML = '<span>A new version is ready.</span><button type="button" id="update-reload">Reload</button>';
          document.body.appendChild(t);
          document.getElementById('update-reload').addEventListener('click', function () { location.reload(); });
        };
        navigator.serviceWorker.addEventListener('controllerchange', function () { if (hadWorker) offer(); });
        navigator.serviceWorker.register('sw.js').then(function (reg) {
          reg.addEventListener('updatefound', function () {
            var w = reg.installing;
            if (w) w.addEventListener('statechange', function () { if (w.state === 'installed' && navigator.serviceWorker.controller) offer(); });
          });
        }).catch(function () {});
      } catch (e) {}
    })();
  </script>
</body>
</html>
